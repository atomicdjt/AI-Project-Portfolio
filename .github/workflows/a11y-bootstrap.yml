name: One-shot accessibility phase executor

on:
  push:
    branches:
      - feat/39-accessibility-baseline
    paths:
      - .github/ops/run-a11y-bootstrap

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove behavior contract is RED before implementation
        shell: bash
        run: |
          set +e
          npm run a11y:test-config > /tmp/a11y-red.log 2>&1
          status=$?
          set -e
          cat /tmp/a11y-red.log
          test "$status" -ne 0
          grep -Eq "ERR_MODULE_NOT_FOUND|Cannot find module|behavior\.mjs" /tmp/a11y-red.log
      - name: Persist expected RED result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/ops
          cat > .github/ops/a11y-phase-result.json <<EOF
          {
            "phase": "task-5-behavior-red",
            "verified_sha": "${GITHUB_SHA}",
            "node": "$(node --version)",
            "npm": "$(npm --version)",
            "result": "expected-red-confirmed"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops/a11y-phase-result.json
          git commit -m "test(a11y): record behavior contract red"
          git push origin HEAD:feat/39-accessibility-baseline
