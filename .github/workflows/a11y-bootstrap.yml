name: One-shot accessibility triage diagnostic

on:
  push:
    branches:
      - feat/39-accessibility-baseline
    paths:
      - .github/ops/run-a11y-bootstrap

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Capture focused browser diagnostics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { chromium } from '@playwright/test'

          const browser = await chromium.launch({ headless: true })
          const result = { sourceSha: process.env.GITHUB_SHA, browserVersion: browser.version(), checks: {} }

          async function pageAt(url, width, height = 844) {
            const context = await browser.newContext({ viewport: { width, height } })
            const page = await context.newPage()
            await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 })
            return { context, page }
          }

          {
            const { context, page } = await pageAt('https://ai-project-portfolio-variantvision.vercel.app/', 390)
            result.checks.variantOverflow390 = await page.evaluate(() => {
              const clientWidth = document.documentElement.clientWidth
              const scrollWidth = document.documentElement.scrollWidth
              const offenders = [...document.querySelectorAll('body *')]
                .map((el) => {
                  const rect = el.getBoundingClientRect()
                  const style = getComputedStyle(el)
                  return {
                    tag: el.tagName.toLowerCase(),
                    className: typeof el.className === 'string' ? el.className : '',
                    text: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 100),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                    width: Math.round(rect.width),
                    overflowX: style.overflowX,
                    display: style.display,
                  }
                })
                .filter((item) => item.width > 0 && (item.right > clientWidth + 2 || item.width > clientWidth + 2))
                .sort((a, b) => Math.max(b.right - clientWidth, b.width - clientWidth) - Math.max(a.right - clientWidth, a.width - clientWidth))
                .slice(0, 30)
              return { clientWidth, scrollWidth, offenders }
            })
            await context.close()
          }

          {
            const { context, page } = await pageAt('https://ai-project-portfolio-scamshield-ai.vercel.app/', 390)
            result.checks.scamshieldMobileToggles = await page.locator('.mode-toggle').evaluateAll((labels) => labels.map((label) => {
              const input = label.querySelector('input')
              const span = label.querySelector('span')
              return {
                visibleText: label.innerText.trim(),
                spanText: span?.textContent?.trim() ?? '',
                spanDisplay: span ? getComputedStyle(span).display : null,
                ariaLabel: input?.getAttribute('aria-label'),
                ariaLabelledby: input?.getAttribute('aria-labelledby'),
                inputType: input?.getAttribute('type'),
              }
            }))
            await context.close()
          }

          {
            const { context, page } = await pageAt('https://ai-project-portfolio-redactready-pr.vercel.app/', 390)
            result.checks.redactreadySessionStatus = await page.locator('.session-status').evaluate((el) => ({
              clientWidth: el.clientWidth,
              scrollWidth: el.scrollWidth,
              tabIndex: el.tabIndex,
              overflowX: getComputedStyle(el).overflowX,
              text: el.textContent?.trim().replace(/\s+/g, ' '),
            }))
            result.checks.redactreadyMeters = await page.locator('.score-meter').evaluateAll((els) => els.map((el) => ({
              tag: el.tagName.toLowerCase(),
              role: el.getAttribute('role'),
              ariaLabel: el.getAttribute('aria-label'),
              ariaValueNow: el.getAttribute('aria-valuenow'),
              text: el.textContent?.trim(),
            })))
            await context.close()
          }

          {
            const { context, page } = await pageAt('https://ai-project-portfolio-variantvision.vercel.app/', 1366, 900)
            result.checks.variantMeters = await page.locator('.score-meter').evaluateAll((els) => els.map((el) => ({
              tag: el.tagName.toLowerCase(),
              role: el.getAttribute('role'),
              ariaLabel: el.getAttribute('aria-label'),
              ariaValueNow: el.getAttribute('aria-valuenow'),
              text: el.textContent?.trim(),
            })))
            const colorTargets = {
              activeCaseSmall: '.case-list button.active small',
              liveFetch: '.live-fetch-btn',
            }
            result.checks.variantRenderedColors = {}
            for (const [name, selector] of Object.entries(colorTargets)) {
              result.checks.variantRenderedColors[name] = await page.locator(selector).first().evaluate((el) => {
                const s = getComputedStyle(el)
                const parent = getComputedStyle(el.parentElement)
                return { color: s.color, backgroundColor: s.backgroundColor, parentBackgroundColor: parent.backgroundColor, fontSize: s.fontSize, fontWeight: s.fontWeight }
              })
            }
            await context.close()
          }

          {
            const { context, page } = await pageAt('https://ai-project-portfolio-portfolio-hub.vercel.app/', 1366, 900)
            result.checks.portfolioMetaColors = await page.locator('.card-meta span:nth-child(2)').evaluateAll((els) => els.slice(0, 8).map((el) => {
              const s = getComputedStyle(el)
              const card = el.closest('.project-card')
              const cardStyle = card ? getComputedStyle(card) : null
              return { text: el.textContent?.trim(), color: s.color, backgroundColor: s.backgroundColor, cardBackgroundColor: cardStyle?.backgroundColor, fontSize: s.fontSize, fontWeight: s.fontWeight }
            }))
            await context.close()
          }

          {
            const { context, page } = await pageAt('https://ai-project-portfolio-scamshield-ai.vercel.app/', 1366, 900)
            result.checks.scamshieldRenderedColors = {
              inactiveStep: await page.locator('.stepper button').nth(1).evaluate((el) => { const s = getComputedStyle(el); return { text: el.textContent?.trim(), color: s.color, backgroundColor: s.backgroundColor, fontSize: s.fontSize, fontWeight: s.fontWeight } }),
              footerLink: await page.locator('.app-footer a').evaluate((el) => { const s = getComputedStyle(el); const p = getComputedStyle(el.parentElement); const footer = getComputedStyle(el.closest('.app-footer')); return { text: el.textContent?.trim(), color: s.color, backgroundColor: s.backgroundColor, parentBackgroundColor: p.backgroundColor, footerBackgroundColor: footer.backgroundColor, fontSize: s.fontSize, fontWeight: s.fontWeight } }),
            }
            await context.close()
          }

          await browser.close()
          fs.mkdirSync('.github/ops', { recursive: true })
          fs.writeFileSync('.github/ops/a11y-triage-diagnostic.json', JSON.stringify(result, null, 2))
          NODE

      - name: Persist triage diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops/a11y-triage-diagnostic.json
          git commit -m "test(a11y): capture focused task 8 diagnostics"
          git push origin HEAD:feat/39-accessibility-baseline
