name: One-shot accessibility phase executor

on:
  push:
    branches:
      - feat/39-accessibility-baseline
    paths:
      - .github/ops/run-a11y-bootstrap

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify unit contracts
        run: npm run a11y:test-config

      - name: Run six-app accessibility baseline
        env:
          AUDIT_SOURCE_SHA: ${{ github.sha }}
        run: npm run a11y:baseline

      - name: Render normalized claim-safe evidence
        run: node scripts/accessibility/render-baseline.mjs

      - name: Verify rendered evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/accessibility/README.md
          test -f docs/accessibility/AUDIT_MATRIX.md
          test -f docs/accessibility/FINDINGS.md
          test -f docs/accessibility/NVDA_MANUAL_CHECK.md
          grep -q "Baseline — remediation not yet applied" docs/accessibility/README.md
          grep -q "not yet tested with genuine screen reader" docs/accessibility/README.md
          if grep -RniE 'WCAG compliant|fully accessible|screen-reader passed|NVDA passed' docs/accessibility; then
            echo "Unsupported accessibility claim detected"
            exit 1
          fi

      - name: Persist Task 6 evidence and phase result
        shell: bash
        run: |
          set -euo pipefail
          desktop=.accessibility-results/baseline-desktop-chromium.json
          narrow=.accessibility-results/baseline-narrow-chromium.json
          total_records="$(jq -s '[.[].records | length] | add' "$desktop" "$narrow")"
          candidate_sections="$(grep -c '^## .*-' docs/accessibility/FINDINGS.md || true)"
          mkdir -p .github/ops
          jq -n \
            --arg phase "task-6-renderer-green" \
            --arg sha "${GITHUB_SHA}" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            --argjson records "$total_records" \
            --argjson candidates "$candidate_sections" \
            '{phase:$phase,verified_sha:$sha,node:$node,npm:$npm,result:"pass",record_count:$records,normalized_candidate_sections:$candidates,assistive_technology_status:"not yet tested with genuine screen reader"}' \
            > .github/ops/a11y-phase-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/accessibility .github/ops/a11y-phase-result.json
          git commit -m "docs(a11y): publish claim-safe baseline evidence"
          git push origin HEAD:feat/39-accessibility-baseline
