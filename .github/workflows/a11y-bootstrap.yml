name: One-shot accessibility phase executor

on:
  push:
    branches:
      - feat/39-accessibility-baseline
    paths:
      - .github/ops/run-a11y-bootstrap

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify accessibility config and evidence contracts
        run: npm run a11y:test-config

      - name: Persist verified phase result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/ops
          cat > .github/ops/a11y-phase-result.json <<EOF
          {
            "phase": "task-3-evidence-green",
            "verified_sha": "${GITHUB_SHA}",
            "node": "$(node --version)",
            "npm": "$(npm --version)",
            "result": "pass"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops/a11y-phase-result.json
          git commit -m "test(a11y): record evidence contract green"
          git push origin HEAD:feat/39-accessibility-baseline
