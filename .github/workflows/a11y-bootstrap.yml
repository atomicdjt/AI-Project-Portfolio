name: One-shot accessibility phase executor

on:
  push:
    branches:
      - feat/39-accessibility-baseline
    paths:
      - .github/ops/run-a11y-bootstrap

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify unit contracts
        run: npm run a11y:test-config
      - name: Run full six-app behavior baseline
        env:
          AUDIT_SOURCE_SHA: ${{ github.sha }}
        run: npm run a11y:baseline
      - name: Persist verified phase result
        shell: bash
        run: |
          set -euo pipefail
          desktop=.accessibility-results/baseline-desktop-chromium.json
          narrow=.accessibility-results/baseline-narrow-chromium.json
          test -f "$desktop"
          test -f "$narrow"
          total_records="$(jq -s '[.[].records | length] | add' "$desktop" "$narrow")"
          test "$total_records" -eq 60
          axe_findings="$(jq -s '[.[].records[] | select(.category == "automated-axe") | (.result.violations | length)] | add' "$desktop" "$narrow")"
          behavior_review_records="$(jq -s '[.[].records[] | select(.category != "automated-axe") | select(.result.status == "review" or .result.status == "possible-cycle" or .result.status == "no-focusable-control")] | length' "$desktop" "$narrow")"
          focus_review_total="$(jq -s '[.[].records[] | select(.category == "keyboard-focus") | (.result.focusIndicatorReviewCount // 0)] | add' "$desktop" "$narrow")"
          mkdir -p .github/ops
          jq -n \
            --arg phase "task-5-full-behavior-baseline" \
            --arg sha "${GITHUB_SHA}" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            --argjson records "$total_records" \
            --argjson axe "$axe_findings" \
            --argjson behavior "$behavior_review_records" \
            --argjson focus "$focus_review_total" \
            '{phase:$phase,verified_sha:$sha,node:$node,npm:$npm,result:"pass",record_count:$records,axe_candidate_findings:$axe,behavior_records_requiring_triage:$behavior,focus_indicator_observations_requiring_triage:$focus}' \
            > .github/ops/a11y-phase-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops/a11y-phase-result.json
          git commit -m "test(a11y): record full behavior baseline verification"
          git push origin HEAD:feat/39-accessibility-baseline
