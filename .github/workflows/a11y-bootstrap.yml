name: One-shot accessibility phase executor

on:
  push:
    branches:
      - feat/39-accessibility-baseline
    paths:
      - .github/ops/run-a11y-bootstrap

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Execute Task 6 and persist diagnostics
        shell: bash
        run: |
          set -u
          failure_stage=""

          run_stage() {
            stage="$1"
            shift
            if [ -n "$failure_stage" ]; then
              return 0
            fi
            set +e
            "$@" > "/tmp/${stage}.log" 2>&1
            status=$?
            set -e
            cat "/tmp/${stage}.log"
            if [ "$status" -ne 0 ]; then
              failure_stage="$stage"
            fi
          }

          run_stage npm-ci npm ci
          run_stage chromium npx playwright install --with-deps chromium
          run_stage unit-contracts npm run a11y:test-config
          run_stage baseline env AUDIT_SOURCE_SHA="$GITHUB_SHA" npm run a11y:baseline
          run_stage renderer node scripts/accessibility/render-baseline.mjs
          run_stage claim-boundary bash -lc 'set -euo pipefail; test -f docs/accessibility/README.md; test -f docs/accessibility/AUDIT_MATRIX.md; test -f docs/accessibility/FINDINGS.md; test -f docs/accessibility/NVDA_MANUAL_CHECK.md; grep -q "Baseline — remediation not yet applied" docs/accessibility/README.md; grep -q "not yet tested with genuine screen reader" docs/accessibility/README.md; if grep -RniE "WCAG compliant|fully accessible|screen-reader passed|NVDA passed" docs/accessibility; then exit 1; fi'

          mkdir -p .github/ops
          if [ -z "$failure_stage" ]; then
            desktop=.accessibility-results/baseline-desktop-chromium.json
            narrow=.accessibility-results/baseline-narrow-chromium.json
            total_records="$(jq -s '[.[].records | length] | add' "$desktop" "$narrow")"
            candidate_sections="$(grep -c '^## .*-' docs/accessibility/FINDINGS.md || true)"
            jq -n \
              --arg phase "task-6-renderer-green" \
              --arg sha "$GITHUB_SHA" \
              --arg node "$(node --version)" \
              --arg npm "$(npm --version)" \
              --argjson records "$total_records" \
              --argjson candidates "$candidate_sections" \
              '{phase:$phase,verified_sha:$sha,node:$node,npm:$npm,result:"pass",record_count:$records,normalized_candidate_sections:$candidates,assistive_technology_status:"not yet tested with genuine screen reader"}' \
              > .github/ops/a11y-phase-result.json
          else
            jq -n \
              --arg phase "task-6-renderer-diagnostic" \
              --arg sha "$GITHUB_SHA" \
              --arg stage "$failure_stage" \
              --rawfile log "/tmp/${failure_stage}.log" \
              '{phase:$phase,verified_sha:$sha,result:"fail",failure_stage:$stage,log_excerpt:($log[-6000:])}' \
              > .github/ops/a11y-phase-result.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops/a11y-phase-result.json
          if [ -z "$failure_stage" ]; then
            git add docs/accessibility
          fi
          git commit -m "test(a11y): record task 6 verification outcome"
          git push origin HEAD:feat/39-accessibility-baseline

          if [ -n "$failure_stage" ]; then
            exit 1
          fi
