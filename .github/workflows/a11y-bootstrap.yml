name: One-shot accessibility phase executor

on:
  push:
    branches:
      - feat/39-accessibility-baseline
    paths:
      - .github/ops/run-a11y-bootstrap

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify config contracts
        run: npm run a11y:test-config

      - name: Run six-app desktop accessibility baseline
        env:
          AUDIT_SOURCE_SHA: ${{ github.sha }}
        run: npm run a11y:baseline -- --project=desktop-chromium

      - name: Persist verified phase result
        shell: bash
        run: |
          set -euo pipefail
          bundle=.accessibility-results/baseline-desktop-chromium.json
          test -f "$bundle"
          record_count="$(jq '.records | length' "$bundle")"
          test "$record_count" -eq 6
          total_findings="$(jq '[.records[].result.violations | length] | add' "$bundle")"
          project_counts="$(jq -c '[.records[] | {projectId, violations: (.result.violations | length)}]' "$bundle")"
          mkdir -p .github/ops
          jq -n \
            --arg phase "task-4-desktop-baseline" \
            --arg sha "${GITHUB_SHA}" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            --argjson records "$record_count" \
            --argjson findings "$total_findings" \
            --argjson projects "$project_counts" \
            '{phase:$phase,verified_sha:$sha,node:$node,npm:$npm,result:"pass",record_count:$records,total_candidate_findings:$findings,projects:$projects}' \
            > .github/ops/a11y-phase-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops/a11y-phase-result.json
          git commit -m "test(a11y): record desktop baseline verification"
          git push origin HEAD:feat/39-accessibility-baseline
