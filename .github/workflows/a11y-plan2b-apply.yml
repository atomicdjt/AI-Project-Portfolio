name: One-shot Plan 2B accessibility apply

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/ops/run-a11y-plan2b-apply'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/39-accessibility-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout remediation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded Plan 2B replacements
        run: python .github/ops/apply-a11y-plan2b.py

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify all 14 accessibility regressions
        run: npm run a11y:remediation

      - name: Verify affected workspace tests and builds
        shell: bash
        run: |
          set -euo pipefail
          npm run test:run --workspace apps/opspilot-ai-operations-toolkit
          npm run build --workspace apps/opspilot-ai-operations-toolkit
          npm run build --workspace apps/layerforge-studio
          npm test --workspace apps/redactready-pro-hri-os
          npm run build --workspace apps/redactready-pro-hri-os
          npm test --workspace apps/scamshield-ai -- --run
          npm run build --workspace apps/scamshield-ai
          npm test --workspace apps/variantvision-pro
          npm run build --workspace apps/variantvision-pro
          npm run build --workspace apps/portfolio-hub

      - name: Commit verified Plan 2B product fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'David Turner'
          git config user.email 'davidelsey9513@gmail.com'
          git add \
            apps/opspilot-ai-operations-toolkit/src/styles.css \
            apps/layerforge-studio/src/index.css \
            apps/redactready-pro-hri-os/src/app/App.tsx \
            apps/redactready-pro-hri-os/src/index.css \
            apps/variantvision-pro/src/index.css \
            apps/portfolio-hub/src/styles.css \
            apps/scamshield-ai/src/styles.css
          git diff --cached --check
          git commit -m 'fix(a11y): remediate remaining audit findings'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
