name: One-shot Plan 2A accessibility apply v4

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/ops/run-a11y-plan2a-apply-v4'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/39-accessibility-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout remediation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded source replacements
        run: python .github/ops/apply-a11y-plan2a.py

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify ScamShield component regression
        run: npm test --workspace apps/scamshield-ai -- --run src/test/app.test.tsx

      - name: Verify all High browser regressions
        run: npm run a11y:remediation

      - name: Verify affected builds
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace apps/portfolio-hub
          npm run build --workspace apps/redactready-pro-hri-os
          npm run build --workspace apps/scamshield-ai
          npm run build --workspace apps/variantvision-pro

      - name: Commit verified product fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'David Turner'
          git config user.email 'davidelsey9513@gmail.com'
          git add \
            apps/portfolio-hub/src/styles.css \
            apps/redactready-pro-hri-os/src/app/App.tsx \
            apps/scamshield-ai/src/components/layout/Header.tsx \
            apps/scamshield-ai/src/test/app.test.tsx \
            apps/variantvision-pro/src/app/App.tsx \
            apps/variantvision-pro/src/index.css
          git diff --cached --check
          git commit -m 'fix(a11y): remediate high-severity findings'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
